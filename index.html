<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>с днём рождения</title>
<style>
  :root{
    --pink: #fb93ac;
    --pink-soft: #ffc2d1;
    --ink: #0a0a0a;
    --paper: #f4f2ee;
    --page-w: clamp(128px, 40vw, 300px);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:#050505;
    background-image:
      radial-gradient(ellipse at 30% 0%, rgba(255,255,255,0.05), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(251,147,172,0.06), transparent 50%);
    font-family: Georgia, 'Times New Roman', 'PT Serif', serif;
    color: #eee7e2;
    overflow-x:hidden;
  }

  .stage{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top: clamp(28px, 8vh, 90px);
    padding-bottom: 40px;
    perspective: 2200px;
  }

  .hint{
    margin: 0 0 22px 0;
    font-size: clamp(12px, 3vw, 14px);
    letter-spacing: 0.04em;
    color: #9c948d;
    opacity: 0.9;
    text-align:center;
    min-height: 1.2em;
    transition: opacity .4s ease;
  }

  /* ---------- BOOK ---------- */
  .book{
    position:relative;
    width: var(--page-w);
    height: calc(var(--page-w) * 3510 / 2482);
    transition: width 1.05s cubic-bezier(.65,0,.35,1);
    /* deliberately flat (not preserve-3d): the cover's own rotateY is still
       3D via .stage's perspective, but keeping this flat means normal
       z-index stacking (not 3D depth-sorting) decides paint order between
       the cover and its siblings — otherwise mid-rotation the cover can
       visually sort behind the flames/buttons on the page underneath it. */
    transform-style: flat;
  }
  .book.open{
    width: calc(var(--page-w) * 2);
  }

  .page{
    position:absolute;
    top:0; bottom:0;
    width: var(--page-w);
    aspect-ratio: 2482 / 3510;
    border-radius: 3px;
    overflow:hidden;
    background:#111;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7);
  }
  .page-left{ left:0; border-radius: 6px 2px 2px 6px; }
  .page-right{ right:0; border-radius: 2px 6px 6px 2px; }

  .page-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    pointer-events:none;
  }

  /* ---------- COVER (single panel, hinged on the left edge like a real
     greeting card — it swings open to the left, revealing the spread) ---------- */
  .cover{
    position:absolute; top:0; left:0;
    width: var(--page-w);
    height:100%;
    z-index:20;
    background-repeat:no-repeat;
    background-size: 100% 100%;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7);
    transition: transform 1.05s cubic-bezier(.65,0,.35,1), box-shadow 1.05s ease;
    cursor:pointer;
    border-radius: 6px;
    transform-origin: 0% 50%;
    transform: rotateY(0deg);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .book.open .cover{
    transform: rotateY(-178deg);
    box-shadow: none;
  }
  .book:not(.open) .cover:hover{ filter:brightness(1.04); }

  /* ---------- LEFT PAGE: envelope + letter ---------- */
  .page-left{ cursor:pointer; }
  .letter-wrap{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:3;
  }
  .letter-img{
    position:absolute;
    width: 84%;
    left: 8%;
    top: 9%;
    border-radius: 2px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.55);
    object-fit:cover;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    transform-origin: 50% 55%;
    opacity: 0;
    transform: translateY(10%) scale(0.86) rotate(-2deg);
    transition: opacity .5s ease, transform .55s cubic-bezier(.2,.8,.3,1.15);
    pointer-events:none;
  }
  .page-left.lifted .letter-img{
    opacity:1;
    width: 90%;
    left: 5%;
    top: 5%;
    transform: translateY(0) scale(1) rotate(0deg);
    box-shadow: 0 22px 50px rgba(0,0,0,0.65);
  }
  .peek-tap-hint{
    position:absolute;
    bottom: 6%;
    left:0; right:0;
    text-align:center;
    font-size: clamp(10px,2.6vw,12px);
    color:#cfc7c0;
    opacity:.75;
    letter-spacing:.03em;
    z-index:4;
    transition:opacity .3s ease;
    pointer-events:none;
  }
  .page-left.lifted .peek-tap-hint{ opacity:0; }

  /* ---------- RIGHT PAGE: cake + flames ---------- */
  /* .page already establishes a positioning context (position:absolute)
     for the flames/meter/etc. below — no extra rule needed here. */
  .flame{
    position:absolute;
    width: 7.6%;
    transform-origin: 50% 96%;
    filter: drop-shadow(0 0 10px rgba(255,140,170,0.55));
    transition: opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
    will-change: transform;
    pointer-events:none;
  }
  .flame.out{
    opacity:0;
    visibility:hidden;
    filter:none;
    transform: translateY(6%) scale(.35) rotate(50deg) !important;
  }
  #flame-c1{ left:29.09%; top:37.98%; }
  #flame-c2{ left:44.72%; top:37.98%; }
  #flame-c3{ left:60.39%; top:37.98%; }

  .blow-btn{
    position:absolute;
    left:50%; bottom: 23%;
    transform: translateX(-50%);
    z-index:6;
    font-family:inherit;
    font-size: clamp(11px,2.6vw,13px);
    letter-spacing:.03em;
    color:#1a1210;
    background: var(--pink-soft);
    border:none;
    padding: 8px 16px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,0.45);
    -webkit-user-select:none; user-select:none;
    touch-action: manipulation;
    white-space:nowrap;
  }
  .blow-btn:active{ transform: translateX(-50%) scale(.95); }

  .page-right.blown .blow-btn{
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }

  .wish-overlay{
    position:absolute; inset:0;
    z-index:8;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    background: rgba(4,4,4,0.28);
    opacity:0;
    pointer-events:none;
    transition: opacity .6s ease;
  }
  .page-right.blown .wish-overlay{ opacity:1; pointer-events:auto; }
  .wish-box{
    transform: translateY(10px) scale(0.94);
    transition: transform .6s cubic-bezier(.2,.8,.3,1.2);
    padding: 0 8%;
  }
  .page-right.blown .wish-box{ transform: translateY(0) scale(1); }
  .wish-title{
    font-style: italic;
    font-size: clamp(15px, 4.4vw, 22px);
    color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,0.8);
    margin: 0 0 14px 0;
    line-height:1.35;
  }
  .relight-btn{
    font-family:inherit;
    font-size: clamp(11px,2.6vw,13px);
    color:#1a1210;
    background: var(--pink);
    border:none;
    padding: 8px 18px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,0.45);
  }

  .confetti-layer{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:7;
  }
  .confetti-piece{
    position:absolute;
    top:-6%;
    width:6px; height:10px;
    background:#0a0a0a;
    opacity:0.9;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.35), 0 1px 3px rgba(0,0,0,0.5);
    will-change: transform, opacity;
  }
  /* confetti fall is driven by JS (rAF), not CSS keyframes, for reliable
     cross-environment motion */

  /* ---------- back to cover button ---------- */
  .back-btn{
    margin-top: 26px;
    font-family:inherit;
    font-size: 12px;
    letter-spacing:.05em;
    color:#cfc7c0;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.22);
    padding: 8px 16px;
    border-radius: 999px;
    cursor:pointer;
    opacity:0;
    height:0;
    overflow:hidden;
    transition: opacity .4s ease, margin .4s ease;
    pointer-events:none;
  }
  .book.open ~ .back-btn{
    opacity:1; height:auto; padding:8px 16px; pointer-events:auto;
  }
  .back-btn:hover{ border-color: var(--pink); color:#fff; }

  .footnote{
    margin-top: 18px;
    max-width: 340px;
    text-align:center;
    font-size: 11px;
    line-height:1.5;
    color:#7a736d;
    padding: 0 18px;
  }

  @media (prefers-reduced-motion: reduce){
    .cover, .letter-img, .flame, .wish-overlay, .wish-box{ transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="hint" id="topHint">tap the photo to open</div>

  <div class="book" id="book">
    <!-- spread underneath -->
    <div class="page page-left" id="pageLeft">
      <img class="page-bg" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUH[...]
      <div class="letter-wrap">
        <img class="letter-img" id="letterImg" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEAwQFBAQFBgoHBgYGBg0JCggKDw0QEA8NDw4RExgUERIXEg4PFRwVFxkZGxsbEBQdHx0aHxgaGxr/2wBDA[...]
      </div>
      <div class="peek-tap-hint" id="peekHint">tap the letter to read it</div>
    </div>

    <div class="page page-right" id="pageRight">
      <img class="page-bg" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUH[...]
      <div class="confetti-layer" id="confetti"></div>
      <button class="blow-btn" id="blowBtn">hold to blow</button>
      <div class="wish-overlay" id="wishOverlay">
        <div class="wish-box">
          <div class="wish-title" id="wishText"></div>
          <button class="relight-btn" id="relightBtn">again</button>
        </div>
      </div>
      <svg width="100%" height="100%" style="position:absolute;top:0;left:0;pointer-events:none;">
        <image id="flame-c1" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 160'%3E%3Cdefs%3E%3ClinearGradient id='flamegradient' x1='50%25' y1='0%25' x2='50%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23ffff00;stop-opacity:1'/%3E%3Cstop offset='50%25' style='stop-color:%23ff8c00;stop-opacity:1'/%3E%3Cstop offset='100%25' style='stop-color:%23ff0000;stop-opacity:0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M 50 10 Q 30 40 40 80 Q 50 100 50 140 Q 50 100 60 80 Q 70 40 50 10' fill='url(%23flamegradient)'/%3E%3C/svg%3E" class="flame" width="7.6%" height="auto"/>
        <image id="flame-c2" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 160'%3E%3Cdefs%3E%3ClinearGradient id='flamegradient' x1='50%25' y1='0%25' x2='50%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23ffff00;stop-opacity:1'/%3E%3Cstop offset='50%25' style='stop-color:%23ff8c00;stop-opacity:1'/%3E%3Cstop offset='100%25' style='stop-color:%23ff0000;stop-opacity:0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M 50 10 Q 30 40 40 80 Q 50 100 50 140 Q 50 100 60 80 Q 70 40 50 10' fill='url(%23flamegradient)'/%3E%3C/svg%3E" class="flame" width="7.6%" height="auto"/>
        <image id="flame-c3" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 160'%3E%3Cdefs%3E%3ClinearGradient id='flamegradient' x1='50%25' y1='0%25' x2='50%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23ffff00;stop-opacity:1'/%3E%3Cstop offset='50%25' style='stop-color:%23ff8c00;stop-opacity:1'/%3E%3Cstop offset='100%25' style='stop-color:%23ff0000;stop-opacity:0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M 50 10 Q 30 40 40 80 Q 50 100 50 140 Q 50 100 60 80 Q 70 40 50 10' fill='url(%23flamegradient)'/%3E%3C/svg%3E" class="flame" width="7.6%" height="auto"/>
      </svg>
    </div>

    <img class="cover" id="cover" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUH[...]" alt="cover"/>
  </div>

  <button class="back-btn" id="backBtn">back</button>
  <div class="footnote">made with 💖</div>
</div>

<script>
const book = document.getElementById('book');
const cover = document.getElementById('cover');
const pageLeft = document.getElementById('pageLeft');
const pageRight = document.getElementById('pageRight');
const blowBtn = document.getElementById('blowBtn');
const wishText = document.getElementById('wishText');
const relightBtn = document.getElementById('relightBtn');
const wishOverlay = document.getElementById('wishOverlay');
const backBtn = document.getElementById('backBtn');
const confettiContainer = document.getElementById('confetti');
const letterImg = document.getElementById('letterImg');

const wishes = [
  '✨ may all your wishes come true ✨',
  '🎉 happy birthday to you! 🎉',
  '💝 wishing you joy and happiness 💝',
  '🌟 another year around the sun 🌟',
];

// Book opening
cover.addEventListener('click', () => {
  book.classList.toggle('open');
});

// Letter reveal
pageLeft.addEventListener('click', () => {
  pageLeft.classList.toggle('lifted');
});

// Blow button
blowBtn.addEventListener('mousedown', () => blowCandles());
blowBtn.addEventListener('touchstart', () => blowCandles());
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    blowCandles();
  }
});

function blowCandles() {
  pageRight.classList.add('blown');
  extinguishFlames();
  showWish();
  createConfetti();
}

function extinguishFlames() {
  document.querySelectorAll('.flame').forEach(flame => {
    flame.classList.add('out');
  });
}

function showWish() {
  wishText.textContent = wishes[Math.floor(Math.random() * wishes.length)];
}

function createConfetti() {
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti-piece';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.backgroundColor = Math.random() > 0.5 ? 'var(--pink)' : 'var(--pink-soft)';
    confettiContainer.appendChild(confetti);
    
    const duration = 2 + Math.random() * 1;
    const delay = Math.random() * 0.2;
    confetti.animate([
      { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
      { transform: `translateY(${window.innerHeight}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
    ], { duration: duration * 1000, delay: delay * 1000 });
    
    setTimeout(() => confetti.remove(), (duration + delay) * 1000);
  }
}

// Relight candles
relightBtn.addEventListener('click', () => {
  pageRight.classList.remove('blown');
  document.querySelectorAll('.flame').forEach(flame => {
    flame.classList.remove('out');
  });
  wishOverlay.style.opacity = '0';
  setTimeout(() => {
    wishOverlay.style.pointerEvents = 'none';
  }, 600);
});

// Back button
backBtn.addEventListener('click', () => {
  book.classList.remove('open');
  pageLeft.classList.remove('lifted');
  pageRight.classList.remove('blown');
  document.querySelectorAll('.flame').forEach(flame => {
    flame.classList.remove('out');
  });
});
</script>
</body>
</html>
